# Называем workflow
name: DIPLOM-GURU-QA
# Когда мы запускаем автотесты
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
 # ручной запуск   
  workflow_dispatch:
# jobs
jobs:
  e2eTests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      # делаем чекаут
      - uses: actions/checkout@v4
      # устанавливаем node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # устанавливаем пакеты node
      - name: Установить пакеты
        run: npm ci
      # устанавливаем PW
      - name: Установить PW
        run: npx playwright install --with-deps
      - name: Запустить PW
        run: npm run test
      # Сохраняем отчет PW  
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: test-results
          path: test-results
          retention-days: 20
      # Сохраняем результаты Allure 
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results
          retention-days: 20
      # Забираем результаты предыдущего запуска  
      - uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      # Формируем из allure-results отчёт allure-report
      - uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20
      # Деплоим отчёт
      - name: deploy report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.TOKEN_GITHUB }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Install allurectl
        run: |
          curl -o allurectl -L "https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64"
          chmod +x allurectl
          sudo mv allurectl /usr/local/bin/

      - name: Upload results to Allure TestOps
        if: always()
        run: |
          allurectl upload allure-results \
            --endpoint https://allure.autotests.cloud \
            --project-id 5016 \
            --token ${{ secrets.ALLURE_TOKEN }} \
            --launch-name "GitHub Run #${{ github.run_number }}"

      - name: Parse Allure summary
        id: parse_summary
        if: always()
        run: |
          SUMMARY_FILE="allure-report/widgets/summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            PASSED=$(jq '.statistic.passed' $SUMMARY_FILE)
            FAILED=$(jq '.statistic.failed' $SUMMARY_FILE)
            SKIPPED=$(jq '.statistic.skipped' $SUMMARY_FILE)
            TOTAL=$(jq '.statistic.total' $SUMMARY_FILE)
            echo "PASSED=$PASSED" >> $GITHUB_ENV
            echo "FAILED=$FAILED" >> $GITHUB_ENV
            echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV
            echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          fi

      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            📦 *Результаты автотестов* 
            🎯 Репозиторий: ${{ github.repository }}
            🔄 Ветка: ${{ github.ref_name }}
            🕐 Время: ${{ github.event.created_at || github.run_started_at }}
            ✅ Статус: ${{ job.status }}
            
            ${{ steps.playwright.conclusion == 'success' && '🟢 Все тесты прошли!' || '🔴 Тесты упали!' }}
            📊 Пройдено: ${{ env.PASSED }} / ${{ env.TOTAL }}

            🔗 [Посмотреть логи](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            📊 [Посмотреть Allure отчёт](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report)
          format: markdown    
name: DIPLOM-GURU-QA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  e2eTests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Установить пакеты
        run: npm ci

      - name: Установить PW
        run: npx playwright install --with-deps

      - name: Запустить PW
        id: playwright
        run: npm run test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Сохранить результаты Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 20

      - name: Сохранить результаты Allure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 20

      - name: Установить jq
        run: sudo apt-get install -y jq

      - name: Setup allurectl
        if: always()
        run: |
          # Кэшируем allurectl
          if [ ! -f "/usr/local/bin/allurectl" ]; then
            echo "Installing allurectl..."
            curl -o allurectl -L "https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64"
            chmod +x allurectl
            sudo mv allurectl /usr/local/bin/
          fi

      - name: Upload results to Allure TestOps
        if: success() || failure()
        run: |
          allurectl upload allure-results \
            --endpoint ${{ secrets.ALLURE_TESTOPS_URL }} \
            --project-id ${{ secrets.ALLURE_TESTOPS_PROJECT_ID }} \
            --token ${{ secrets.ALLURE_TESTOPS_API_KEY }} \
            --insecure


      - name: Сгенерировать Allure отчёт
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Parse Allure summary
        id: parse_summary
        if: always()
        run: |
          SUMMARY_FILE="allure-report/widgets/summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            PASSED=$(jq '.statistic.passed' $SUMMARY_FILE)
            FAILED=$(jq '.statistic.failed' $SUMMARY_FILE)
            SKIPPED=$(jq '.statistic.skipped' $SUMMARY_FILE)
            TOTAL=$(jq '.statistic.total' $SUMMARY_FILE)
          else
            PASSED=0; FAILED=0; SKIPPED=0; TOTAL=0
          fi
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

      - name: Check Allure Report
        run: |
          if [ -d "allure-report" ]; then
            echo "✅ allure-report found"
            ls -la allure-report/
          else
            echo "❌ allure-report not generated!"
            ls -la
            exit 1
          fi


      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          commit_message: ${{ github.event_name }}-${{ github.run_id }}

      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            📦 *Результаты автотестов* 
            🎯 Репозиторий: ${{ github.repository }}
            🔄 Ветка: ${{ github.ref_name }}
            🕐 Время: ${{ github.event.created_at || github.run_started_at }}
            ✅ Статус: ${{ job.status }}
            
            ${{ steps.playwright.conclusion == 'success' && '🟢 Все тесты прошли!' || '🔴 Тесты упали!' }}
            📊 Пройдено: ${{ env.PASSED }} / ${{ env.TOTAL }}

            🔗 [Посмотреть логи](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            📊 [Посмотреть Allure отчёт](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report)
          format: markdown
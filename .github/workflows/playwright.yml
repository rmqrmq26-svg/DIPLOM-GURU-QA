name: DIPLOM-GURU-QA
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
#Описание джоб  
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Установка Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Установить пакеты
      run: npm ci

    - name: Установить браузеры
      run: npx playwright install --with-deps
    - name: Запуск тестов
      run: npm t
    - name: Запускаем генерацию allure в одном файле
      run: npm run allureFile
      if: always()
      continue-on-error: true
      #cохраняем результаты
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      continue-on-error: true
      with:
        name: allure-report
        path: allure-report
        retention-days: 30

    - name:    
      if: always()
      run: |
          STATUS=${{ job.status }}
          if [ "$STATUS" = "success" ]; then
            EMOJI="🎉"
            STATUS_TEXT="УСПЕХ"
          else
            EMOJI="🚨" 
            STATUS_TEXT="НЕУДАЧА"
          fi
    
          MESSAGE="$EMOJI *$STATUS_TEXT* $EMOJI%0A\
          ━━━━━━━━━━━━━━━━━%0A\
          📊 *Статистика тестов:*%0A\
          ▫️ Всего пройдено: *$TOTAL*%0A\
          ✅ Успешные: *$PASSED*%0A\
          ❌ Провалено: *$FAILED*%0A\
          ⏭️ Пропущено: *$SKIPPED*%0A\
          ━━━━━━━━━━━━━━━━━%0A\
          🔗 [Allure отчет](https://github.io/rmqrmq26-svg/DIPLOM-GURU-QA/)%0A\
          🧪 [Allure TestOps](https://allure.autotests.cloud/project/5016)%0A\
          📦 [Артефакты](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})%0A\
          ━━━━━━━━━━━━━━━━━%0A\
          🏷️ *Run #${{ github.run_number }}*"

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d parse_mode=Markdown \
          -d text="$MESSAGE"
          
    - name: Parse Allure summary
      id: parse_summary
      if: always()
      run: |
          SUMMARY_FILE="allure-report/widgets/summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            PASSED=$(jq '.statistic.passed' $SUMMARY_FILE)
            FAILED=$(jq '.statistic.failed' $SUMMARY_FILE)
            SKIPPED=$(jq '.statistic.skipped' $SUMMARY_FILE)
            TOTAL=$(jq '.statistic.total' $SUMMARY_FILE)
            echo "PASSED=$PASSED" >> $GITHUB_ENV
            echo "FAILED=$FAILED" >> $GITHUB_ENV
            echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV
            echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          fi